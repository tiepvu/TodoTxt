# Baut todo für macOS und Windows und hängt die Programme an ein GitHub-Release.
#
# Auslösen:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Der Tag muss zur Version in Cargo.toml passen (v0.1.0 ↔ version = "0.1.0").

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Tag passt zu Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu version = \"$version\" in Cargo.toml"
            exit 1
          fi
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Packen (macOS)
        if: runner.os == 'macOS'
        run: |
          archive="todo-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" todo
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "todo-$env:GITHUB_REF_NAME-${{ matrix.name }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/todo.exe" -DestinationPath $archive
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
